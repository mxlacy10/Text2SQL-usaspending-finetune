seed: 42
spark:
  app_name: t2s
  warehouse_dir: ./spark-warehouse
catalog: null            # set to a Unity Catalog name when running on Databricks
schema: usaspending
data:
  raw_dir: ./data/raw
  fiscal_years: [2022, 2023, 2024]
  award_types: [contracts]
  # Bounded to one awarding agency (toptier) so local Spark stays fast.
  # Empty list = no agency filter (all of government; not recommended locally).
  agencies: ["Department of Veterans Affairs"]
models:
  base: Qwen/Qwen2.5-7B-Instruct
  alternate: meta-llama/Llama-3.1-8B-Instruct
  frontier: gpt-5-chat   # Azure AI Foundry deployment, set 2026-10-19 (record exact model ID + date when used)
  frontier_azure_endpoint: https://foundrydemogbp-resource.services.ai.azure.com/openai/v1
mlflow:
  tracking_uri: ./mlruns
  experiment: text2sql-usaspending
