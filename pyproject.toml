[project]
name = "t2s"
version = "0.1.0"
description = "QLoRA Text2SQL fine-tune over USAspending.gov data in Delta, with execution-accuracy evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyspark>=3.5,<4",
  "delta-spark>=3.2,<4",
  "sqlglot>=25",
  "pydantic>=2.7",
  "pyyaml>=6",
  "mlflow>=2.14",
  "httpx>=0.27",
]

[project.optional-dependencies]
train = ["mlx-lm>=0.31"]
serve = ["fastapi>=0.111", "uvicorn>=0.30"]
synth = ["openai>=1.35", "anthropic>=0.30", "azure-identity>=1.17"]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8", "types-PyYAML>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2s"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["t2s"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
